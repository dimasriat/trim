[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@1inch/solidity-utils/=lib/solidity-utils/",
    "@1inch/aqua/=lib/aqua/",
    "@1inch/swap-vm/=lib/swap-vm/",
]

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
